<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="site-header product-site-header" id="siteHeader">
    <div class="nav-container">
      <a class="nav-brand" href="/">
        <img class="nav-logo-img" src="https://st2.depositphotos.com/9923666/48269/v/450/depositphotos_482692906-stock-illustration-car-garage-premium-concept-logo.jpg" alt="CarBuy">
        <div class="nav-brand-text">
          <span class="nav-brand-name">CarBuy</span>
          <span class="nav-brand-tag">India</span>
        </div>
      </a>
      <nav class="nav-center" aria-label="Main">
        <a href="/#cars" class="nav-lnk">Cars</a>
        <a href="/#features" class="nav-lnk">Features</a>
        <a href="/#contact" class="nav-lnk">Contact</a>
        <button class="nav-lnk nav-admin-lnk" id="adminNavBtn">Admin</button>
      </nav>
      <div class="nav-right">
        <form class="nav-srch-pill" action="/#cars" method="get" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="carSearch" name="q" type="search" class="nav-srch-input" placeholder="Search cars..." aria-label="Search cars">
        </form>
        <button class="nav-ico" id="themeToggleBtn" aria-label="Toggle theme">
          <span class="theme-toggle-icon">&#127769;</span>
        </button>
        <button class="nav-ico nav-wl-btn" id="wishlistNavBtn" aria-label="Wishlist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="wishlist-badge" id="wishlistBadge">0</span>
        </button>
        <div class="nav-user" id="navUser" style="display:none">
          <button class="nav-user-btn" id="navUserBtn" aria-label="My profile">
            <div class="nav-user-avatar" id="navUserAvatar">?</div>
            <span class="nav-user-name" id="navUserName"></span>
            <svg class="nav-user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="nav-user-dropdown" id="navUserDropdown">
            <div class="nav-user-info-row">
              <div class="nav-user-avatar-lg" id="dropdownAvatar">?</div>
              <div><strong id="dropdownUserName"></strong><span id="dropdownUserEmail"></span></div>
            </div>
            <div class="nav-dropdown-divider"></div>
            <button class="nav-dropdown-item" id="dropdownWishlist">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              My Wishlist
            </button>
            <div class="nav-dropdown-divider"></div>
            <button class="nav-dropdown-item nav-logout-item" id="navLogout">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Sign Out
            </button>
          </div>
        </div>
        <button class="nav-login-btn" id="openAuthModal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <span class="nl-text">Login</span>
        </button>
        <button class="nav-ico mob-only" id="mobSearchToggle" aria-label="Search" aria-controls="mobSrchBar" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="nav-ham" id="mobileMenuBtn" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
    <div class="mob-srch-bar" id="mobSrchBar">
      <form class="mob-srch-inner" action="/#cars" method="get" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="mobileCarSearch" name="q" type="search" placeholder="Search cars, brands..." aria-label="Search cars">
        <button class="mob-srch-close" id="mobSrchClose" type="button" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </form>
    </div>
  </header>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <nav class="nav-drawer" id="navDrawer" aria-hidden="true" role="dialog" aria-label="Navigation menu">
    <div class="drawer-top">
      <div class="drawer-brand">
        <img src="https://st2.depositphotos.com/9923666/48269/v/450/depositphotos_482692906-stock-illustration-car-garage-premium-concept-logo.jpg" alt="CarBuy" class="drawer-logo">
        <div><span class="drawer-brand-name">CarBuy India</span><span class="drawer-brand-sub">Find your next car</span></div>
      </div>
      <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
      </button>
    </div>
    <div class="drawer-divider"></div>
    <nav class="drawer-nav">
      <a href="/#cars" class="drawer-lnk" data-icon="car"><span class="dlnk-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 13 1.5-4.2A2.7 2.7 0 0 1 7 7h9.5a3 3 0 0 1 2.4 1.2L21 12v5h-2"/><path d="M5 17H3v-4h18M7 17h10"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="m5 12 1.2-3h9.9l2.2 3"/></svg></span><span class="dlnk-label">Cars</span><svg class="dlnk-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></a>
      <a href="/#features" class="drawer-lnk" data-icon="star"><span class="dlnk-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span><span class="dlnk-label">Features</span><svg class="dlnk-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></a>
      <a href="/#contact" class="drawer-lnk" data-icon="phone"><span class="dlnk-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.6 19.79 19.79 0 0 1 1.6 5 2 2 0 0 1 3.57 3h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 10.6a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span><span class="dlnk-label">Contact</span><svg class="dlnk-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></a>
      <button class="drawer-lnk drawer-admin-lnk" id="drawerAdminBtn"><span class="dlnk-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span><span class="dlnk-label">Admin</span><svg class="dlnk-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
    </nav>
    <div class="drawer-footer">
      <button class="drawer-login-btn" id="drawerLoginBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Login / Register</button>
      <p class="drawer-tagline">India's trusted car platform &#127758;</p>
    </div>
  </nav>

  <div class="auth-modal-backdrop" id="authBackdrop" role="dialog" aria-modal="true" aria-label="Authentication">
    <div class="auth-modal" id="authModal">
      <button class="auth-close" id="authClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="auth-blob auth-blob-1"></div>
      <div class="auth-blob auth-blob-2"></div>
      <div class="auth-brand">
        <img src="https://st2.depositphotos.com/9923666/48269/v/450/depositphotos_482692906-stock-illustration-car-garage-premium-concept-logo.jpg" alt="CarBuy" class="auth-logo">
        <h2 class="auth-headline">CarBuy India</h2>
      </div>
      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab">Login</button>
        <button class="auth-tab" data-tab="register" role="tab">Register</button>
        <button class="auth-tab" data-tab="admin" role="tab">Admin</button>
        <div class="auth-tab-indicator"></div>
      </div>
      <div class="auth-forms-wrap">
        <form id="loginForm" class="auth-form active" data-form="login" novalidate>
          <div class="auth-field">
            <input type="email" name="email" id="loginEmail" placeholder=" " autocomplete="email" required>
            <label for="loginEmail">Email address</label>
          </div>
          <div class="auth-field">
            <input type="password" name="password" id="loginPassword" placeholder=" " autocomplete="current-password" required>
            <label for="loginPassword">Password</label>
            <button type="button" class="auth-eye" data-target="loginPassword" aria-label="Show/hide password"><svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <button type="submit" class="auth-submit" id="loginSubmit"><span class="auth-submit-text">Sign In</span><span class="auth-submit-loader"></span></button>
          <p class="auth-status" id="loginStatus"></p>
          <p class="auth-switch">No account? <button type="button" class="auth-switch-btn" data-tab="register">Create one &rarr;</button></p>
        </form>
        <form id="registerForm" class="auth-form" data-form="register" novalidate>
          <div class="auth-field"><input type="text" name="fullName" id="regName" placeholder=" " autocomplete="name" required><label for="regName">Full name</label></div>
          <div class="auth-field"><input type="email" name="email" id="regEmail" placeholder=" " autocomplete="email" required><label for="regEmail">Email address</label></div>
          <div class="auth-field"><input type="tel" name="phone" id="regPhone" placeholder=" " autocomplete="tel" required><label for="regPhone">Phone number</label></div>
          <div class="auth-field">
            <input type="password" name="password" id="regPassword" placeholder=" " autocomplete="new-password" required><label for="regPassword">Password</label>
            <button type="button" class="auth-eye" data-target="regPassword" aria-label="Show/hide password"><svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <div class="pw-strength" id="pwStrength"><div class="pw-bar"><div class="pw-fill" id="pwFill"></div></div><span class="pw-label" id="pwLabel"></span></div>
          <div class="auth-field">
            <input type="password" name="confirmPassword" id="regConfirm" placeholder=" " autocomplete="new-password" required><label for="regConfirm">Confirm password</label>
            <button type="button" class="auth-eye" data-target="regConfirm" aria-label="Show/hide password"><svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <button type="submit" class="auth-submit" id="registerSubmit"><span class="auth-submit-text">Create Account</span><span class="auth-submit-loader"></span></button>
          <p class="auth-status" id="registerStatus"></p>
          <p class="auth-switch">Have an account? <button type="button" class="auth-switch-btn" data-tab="login">Sign in &rarr;</button></p>
        </form>
        <form id="adminForm" class="auth-form" data-form="admin" novalidate>
          <div class="auth-admin-badge">Admin Access</div>
          <div class="auth-field"><input type="text" name="username" id="adminUsername" placeholder=" " autocomplete="username" required><label for="adminUsername">Username</label></div>
          <div class="auth-field">
            <input type="password" name="password" id="adminPassword" placeholder=" " autocomplete="current-password" required><label for="adminPassword">Password</label>
            <button type="button" class="auth-eye" data-target="adminPassword" aria-label="Show/hide password"><svg class="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
          </div>
          <button type="submit" class="auth-submit auth-submit--admin" id="adminSubmit"><span class="auth-submit-text">Admin Login</span><span class="auth-submit-loader"></span></button>
          <p class="auth-status" id="adminStatus"></p>
        </form>
      </div>
    </div>
  </div>
  <div class="wishlist-backdrop" id="wishlistBackdrop">
    <div class="wishlist-drawer" id="wishlistDrawer" role="dialog" aria-label="My Wishlist">
      <div class="wishlist-hdr">
        <div class="wishlist-hdr-title"><svg viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="0"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>My Wishlist</div>
        <button class="wishlist-close" id="wishlistCloseBtn" aria-label="Close">&times;</button>
      </div>
      <div id="wishlistContent" class="wishlist-body"></div>
    </div>
  </div>

  <main class="container product-detail">
    <a class="btn btn-secondary btn-back" href="index.html">&larr; Back to cars</a>
    <div id="productContent"></div>
  </main>

  <script src="app.js"></script>
  <script src="product.js"></script>
  <script src="auth-modal.js"></script>
</body>
</html>
